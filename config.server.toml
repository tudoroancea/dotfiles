[dotfiles]
"~/.config/nvim_native" = { source = "nvim_native", mode = "symlink" }
"~/.config/herdr" = { source = "herdr", mode = "symlink-each" }
"~/.fx/AGENTS.md" = { source = "agents/shared/AGENTS.md", mode = "symlink" }
"~/.fx/skills" = { source = "agents/shared/skills", mode = "symlink-each" }

[bootstrap.hooks.pre-packages]
run = """
set -eu
if command -v apt-get >/dev/null 2>&1; then
  . /etc/os-release
  list_file=/etc/apt/sources.list.d/tailscale.list
  keyring=/usr/share/keyrings/tailscale-archive-keyring.gpg
  if [ ! -s "$list_file" ] || [ ! -s "$keyring" ]; then
    staging=$(mktemp -d)
    trap 'rm -rf "$staging"' EXIT
    curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.noarmor.gpg" -o "$staging/tailscale.gpg"
    curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.tailscale-keyring.list" -o "$staging/tailscale.list"
    sudo install -m 0644 "$staging/tailscale.gpg" "$keyring"
    sudo install -m 0644 "$staging/tailscale.list" "$list_file"
    sudo apt-get update
  fi
fi
"""

[bootstrap.packages]
"apt:tailscale" = "latest"

[tools]
node = "latest"
npm = "latest"
"npm:wrangler" = "latest"
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"
nub = "latest"
"github:vercel-labs/fx" = "latest"
