[dotfiles]
"~/.zshrc/uv" = { block = """
eval \"$(uv generate-shell-completion zsh)\"
export UV_PYTHON_PREFERENCE=only-managed
# Fix completions for uv run to autocomplete .py files
_uv_run_mod() {
    if [[ "$words[2]" == "run" && "$words[CURRENT]" != -* ]]; then
        _arguments '*:filename:_files -g "*.py"'
    else
        _uv "$@"
    fi
}
compdef _uv_run_mod uv
""" }

"~/.zshrc/bun" = { block = """
# bun completions
[ -s "/home/ted/.bun/_bun" ] && source "/home/ted/.bun/_bun"

# bun
export BUN_INSTALL="$HOME/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
""" }

"~/.zshrc/worktrunk" = { block = "if command -v wt >/dev/null 2>&1; then eval \"$(command wt config shell init zsh)\"; fi" }
"~/.config/worktrunk/config.toml" = { source = "worktrunk/config.toml", mode = "symlink" }

"~/.config/nvim_native" = { source = "nvim_native", mode = "symlink" }
"~/.config/herdr" = { source = "herdr", mode = "symlink-each" }

"~/.claude" = { source = "agents/claude", mode = "symlink-each" }
# "~/.claude/skills/*" = { source = "agents/shared/skills/*", mode = "symlink" }
# "~/.claude/skills/*" = { source = "agents/shared/skills/*", mode = "symlink" }
# "~/.codex/skills/*" = { source = "agents/shared/skills/*", mode = "symlink" }
# "~/.codex/config.toml/shared" = { source = "agents/claude", mode = "symlink-each" }
"~/.codex/AGENTS.md" = { source = "agents/shared/AGENTS.md", mode = "symlink" }
"~/.zshrc/get_skill" = { block = """
get_skill() {
  if [ "$#" -ne 3 ]; then
    echo "Usage: get_skill <repo_name> <skill_name> <dir>" >&2
    return 2
  fi

  local repo_name="$1"
  local skill_name="$2"
  local destination_dir="$3"
  local destination
  local temp_dir

  case "$destination_dir" in
    /*) ;;
    *) destination_dir="$PWD/$destination_dir" ;;
  esac
  destination="$destination_dir/$skill_name"

  if [ -e "$destination" ]; then
    echo "get_skill: destination already exists: $destination" >&2
    return 1
  fi

  temp_dir="$(mktemp -d)" || return 1
  mkdir -p "$destination_dir" || {
    rm -rf "$temp_dir"
    return 1
  }

  (
    trap 'rm -rf "$temp_dir"' EXIT
    cd "$temp_dir" || exit 1
    skills add "$repo_name" \
      --skill "$skill_name" \
      --agent universal \
      --project \
      --copy \
      --yes || exit 1

    if [ ! -d ".agents/skills/$skill_name" ]; then
      echo "get_skill: installed skill not found: $skill_name" >&2
      exit 1
    fi

    mv ".agents/skills/$skill_name" "$destination"
  )
}
""" }


[tools]
node = "latest"
npm = "latest"
"npm:wrangler" = "latest"
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"
bun = "latest"
nub = "latest"
uv = "latest"
ty = "latest"
ruff = "latest"
worktrunk = "latest"
"npm:skills" = "latest"
"npm:@openai/codex" = "latest"
"claude" = "latest"
zig = "latest"
zls = "latest"
herdr = "latest"
"aqua:boyter/scc" = "latest"
