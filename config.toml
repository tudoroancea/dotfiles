[settings]
lockfile = true

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[dotfiles]
"~/.tmux.conf" = { source = ".tmux.conf", mode = "symlink" }
"~/.p10k.zsh" = { source = ".p10k.zsh", mode = "symlink" }
"~/.condarc" = { source = ".condarc", mode = "symlink" }
"~/.config/btop/btop.conf" = { source = "btop/btop.conf", mode = "symlink" }

######################
# zsh config
######################
# needs to be before mise shims
"~/.zprofile/local-bin" = { block = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zshrc/p10k-init" = { block = """
# Enable Powerlevel10k instant prompt. Should stay close to the top of ~/.zshrc.
if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
  source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
fi
""" }
"~/.zshrc/locale" = { block = """
export LANG="en_US.UTF-8"
export LC_ALL="en_US.UTF-8"
""" }
"~/.zshrc/aliases" = { block = """
alias reloadzsh="source ~/.zshrc"
alias ll="ls -la"
alias l="ls -lah"
alias cdt="cd ~/tmp"
cl() {
  cd "$1" && l
}
mcd() {
  mkdir -p "$1"
  cd "$1"
}
waw() {
  echo "  where :"
  where "$1"
  echo "  which :"
  which "$1"
  echo " version :"
  $(which "$1") --version
}
alias rmr="rm -r"
alias rmrf="rm -rf"
alias py="python3"
alias pdb="python3 -m pdb"
alias lg=lazygit
alias c='code'
alias z='zed'
alias v=nvim
ccopy() {
    cat "$1" | pbcopy
}
alias zrc="nvim ~/.zshrc"
alias fda='fd -u'
alias sizes='du -h -d 1 .'
submodule_rm() {
  git submodule deinit -f -- "$1"
  git rm -f "$1"
  rm -rf .git/modules/"$1"
}

# other python aliases
alias upip='uv pip'
alias py='python'
alias urun='uv run'
alias upy='uv run python'
alias updb='uv run python -m pdb'
alias uscript='uv run --script'

create_worktree() {
    local new_branch="$1"
    local base_branch="${2:-$(git config --get init.defaultBranch || echo main)}"

    # Validate inputs
    if [ -z "$new_branch" ]; then
        echo "Usage: create_worktree <new_branch> [base_branch]" >&2
        return 1
    fi

    # Check if base branch exists (local or remote)
    if ! git show-ref --verify --quiet "refs/heads/$base_branch" && \
       ! git show-ref --verify --quiet "refs/remotes/origin/$base_branch"; then
        echo "Error: Base branch '$base_branch' does not exist" >&2
        return 1
    fi

    # Check if worktree path already exists
    if [ -d ".worktrees/$new_branch" ]; then
        echo "Error: Worktree path '.worktrees/$new_branch' already exists" >&2
        return 1
    fi

    # Create worktree with new branch based on base branch
    git worktree add ".worktrees/$new_branch" -b "$new_branch" "$base_branch"
}
pi-usage() {
   local days="${1:-1}"
   local since
   since="$(date -v-"$days"d +%Y-%m-%d)"
   ccusage-pi daily --since "$since"
 }
alias pirc="cd ~/.pi && pi --provider opencode-go --model minimax-m2.5 --thinking medium"
""" }
"~/.zshrc/fzf" = { block = "source <(fzf --zsh)" }
# "~/.zshrc/ripgrep" = { block = "export RIPGREP_CONFIG_PATH='$HOME/.ripgreprc'" }
"~/.zshrc/general-variables" = { block = """
export EDITOR="nvim"
export CLAUDE_CODE_NO_FLICKER=1
""" }
"~/.zshrc/omz" = { block = """
export ZSH="$HOME/.oh-my-zsh"
ENABLE_CORRECTION="false"
COMPLETION_WAITING_DOTS="true"
export PYTHON_VENV_NAME=".venv" # customize the default venv name used by vrun
ZSH_THEME="powerlevel10k/powerlevel10k"
# oh my zsh plugins
plugins=(
  git  # for gst, gc, etc.
  brew  # for bubu, etc.
  zsh-interactive-cd
  zsh-autosuggestions
  zsh-syntax-highlighting
  zsh-fzf-history-search
)
source $ZSH/oh-my-zsh.sh
""" }
"~/.zshrc/p10k-finish" = { block = "[[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh" }

"~/.config/nvim" = { source = "nvim", mode = "symlink" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.oh-my-zsh/custom/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.oh-my-zsh/custom/plugins/zsh-fzf-history-search" = { url = "https://github.com/joshskidmore/zsh-fzf-history-search" }

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"brew:btop" = "latest"

[tools]
"tmux" = "latest"
"github:neovim/neovim" = "latest"
"github:junegunn/fzf" = "latest"
"github:sharkdp/fd" = "latest"
"github:BurntSushi/ripgrep" = "latest"
"github:jesseduffield/lazygit" = "latest"
bat = "latest"
